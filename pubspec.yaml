name: pinterest_floating_bottom_nav
description: "Pinterest風の浮遊ボトムナビを確認できるFlutterサンプル。"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: NotoSansJP
      fonts:
        - asset: assets/fonts/NotoSansJP[wght].ttf
    - family: Roboto
      fonts:
        - asset: assets/fonts/NotoSansJP[wght].ttf
