name: floating_tile_nav_example
description: "Example app for floating_tile_nav."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  floating_tile_nav:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: NotoSansJP
      fonts:
        - asset: assets/fonts/NotoSansJP[wght].ttf
    - family: Roboto
      fonts:
        - asset: assets/fonts/NotoSansJP[wght].ttf
